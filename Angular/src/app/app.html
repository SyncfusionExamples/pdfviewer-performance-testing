<div class="app">
  <!-- The single result message: how long the last viewer action took -->
  <div class="result-bar" [class.is-pending]="isPending()" [class.is-done]="isDone()" role="status" aria-live="polite">
    <span class="result-icon" aria-hidden="true">
      @if (isPending()) { <span class="spinner"></span> } @else { ⚡ }
    </span>
    <span class="result-text">{{ text() }}</span>
  </div>

  <!-- The standard Syncfusion PDF Viewer with its built-in toolbar -->
  <div class="viewer-host">
    <ejs-pdfviewer #pdfviewer id="container"
      [documentPath]="documentPath"
      [resourceUrl]="resourceUrl"
      style="height: 100%; display: block"
      (documentLoad)="monitor.onDocumentLoad($event)"
      (downloadStart)="monitor.onDownloadStart()"
      (downloadEnd)="monitor.onDownloadEnd()"
      (printStart)="monitor.onPrintStart()"
      (printEnd)="monitor.onPrintEnd()"
      (pageChange)="monitor.onPageChange($event)"
      (pageRenderComplete)="monitor.onPageRenderComplete($event)"
      (textSearchStart)="monitor.onTextSearchStart($event)"
      (textSearchHighlight)="monitor.onTextSearchHighlight($event)">
    </ejs-pdfviewer>
  </div>
</div>
